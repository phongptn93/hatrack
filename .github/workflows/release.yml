name: release
on:
  push:
    tags: ['v*']
  # or Actions → release → Run workflow: tags main as the version and releases it
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.2.0
        required: true
permissions:
  contents: write     # create the release
  id-token: write     # sign build provenance
  attestations: write
env:
  VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $VERSION: use vX.Y.Z" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "release from main only" >&2; exit 1; }
            if gh release view "$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
              echo "$VERSION already exists" >&2; exit 1
            fi
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          ld="-s -w -X main.version=$VERSION"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ld" -o dist/hat-linux-$arch ./cmd/hat
            GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "$ld" -o dist/hat-darwin-$arch ./cmd/hat
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "$ld" -o dist/hat-windows-$arch.exe ./cmd/hat
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "$ld -H windowsgui" -o dist/hatrack-tray-windows-$arch.exe ./cmd/hatrack-tray
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # creates the tag at this commit when the workflow was started by hand
      - run: gh release create "$VERSION" dist/* --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  # the menu bar app links Cocoa through cgo, so it is built on a Mac
  mac-app:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}   # the commit the release job built, even if main moved since
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          NO_INSTALL: '1'
        run: |
          ./build-mac-app.sh
          ditto -c -k --keepParent Hatrack.app Hatrack-macos.zip
          shasum -a 256 Hatrack-macos.zip > Hatrack-macos.zip.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: Hatrack-macos.zip
      - run: gh release upload "$VERSION" Hatrack-macos.zip Hatrack-macos.zip.sha256
        env:
          GH_TOKEN: ${{ github.token }}
